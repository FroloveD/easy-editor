<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Editor</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-group">
    <span class="logo">Easy Editor</span>
    <button id="btn-undo" class="btn" data-i18n-title="title.undo" disabled>↶</button>
    <button id="btn-redo" class="btn" data-i18n-title="title.redo" disabled>↷</button>
  </div>
  <div class="topbar-group bp-group">
    <button class="bp-btn active" data-bp="auto" data-i18n-title="title.desktop" title="Desktop">🖥</button>
    <button class="bp-btn" data-bp="768" data-i18n-title="title.tablet" title="Tablet">▭</button>
    <button class="bp-btn" data-bp="375" data-i18n-title="title.mobile" title="Mobile">📱</button>
  </div>
  <div class="topbar-group">
    <button id="btn-preview" class="btn" data-i18n="app.preview">Просмотр</button>
    <button id="btn-export" class="btn btn-primary" data-i18n="app.export">Экспорт HTML</button>
    <button class="lang-btn active" data-lang="ru">RU</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</header>

<main class="workspace">
  <aside class="panel left">
    <div class="panel-tabs">
      <button class="ptab active" data-tab="library" data-i18n="app.elements">Элементы</button>
      <button class="ptab" data-tab="navigator" data-i18n="app.navigator">Навигатор</button>
    </div>
    <div id="tab-library">
      <p class="hint" data-i18n="app.elementsHint">Клик добавляет элемент внутрь выделенного.</p>
      <div id="library"></div>
    </div>
    <div id="tab-navigator" hidden>
      <div id="navigator"></div>
    </div>
  </aside>

  <section class="center">
    <div id="canvas-frame">
      <div id="canvas"></div>
    </div>
  </section>

  <aside class="panel right">
    <div class="panel-tabs">
      <button class="rtab active" data-rtab="style" data-i18n="app.styles">Стили</button>
      <button class="rtab" data-rtab="settings" data-i18n="app.settings">Свойства</button>
    </div>
    <div id="tab-style">
      <div id="inspector"></div>
    </div>
    <div id="tab-settings" hidden>
      <div id="settings"></div>
    </div>
  </aside>
</main>

<footer id="statusbar">
  <div id="breadcrumbs"></div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/elements.js"></script>
<script src="js/editor.js"></script>
<script src="js/dnd.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
